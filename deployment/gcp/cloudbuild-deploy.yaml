# Minimal Cloud Build config: build Docker image and deploy to Cloud Run
# Skips test/lint steps (run separately in CI)

substitutions:
  _SERVICE_NAME: llm-costops
  _REGION: us-central1
  _PROJECT_ID: agentics-dev
  _ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/agentics-dev/llm-devops

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'deployment/gcp/Dockerfile.cloudrun'
      - '.'

  # Step 2: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}'
    waitFor: ['build']

  # Step 3: Deploy to Cloud Run (dev)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-dev'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}-dev'
      - '--image'
      - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--project'
      - '${_PROJECT_ID}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--service-account'
      - 'llm-costops-sa@${_PROJECT_ID}.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'PLATFORM_ENV=dev,SERVICE_NAME=${_SERVICE_NAME},SERVICE_VERSION=${SHORT_SHA},AGENT_PHASE=phase4,AGENT_LAYER=layer1,MAX_TOKENS=1200,MAX_LATENCY_MS=2500'
      - '--set-secrets'
      - 'RUVECTOR_API_KEY=ruvector-api-key:latest,TELEMETRY_API_KEY=observatory-endpoint:latest,RUVECTOR_ENDPOINT=ruvector-service-url:latest'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '60s'
      - '--concurrency'
      - '80'
      - '--ingress'
      - 'internal'
      - '--vpc-connector'
      - 'agentics-vpc-connector'
    waitFor: ['push']

  # Step 4: Verify deployment health
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-dev'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        SERVICE_URL=$$(gcloud run services describe ${_SERVICE_NAME}-dev \
          --region=${_REGION} \
          --project=${_PROJECT_ID} \
          --format='value(status.url)')

        AUTH_TOKEN=$$(gcloud auth print-identity-token)

        for i in 1 2 3 4 5; do
          STATUS=$$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $$AUTH_TOKEN" \
            "$$SERVICE_URL/health")

          if [ "$$STATUS" = "200" ]; then
            echo "Health check passed"
            exit 0
          fi

          echo "Attempt $$i: Health check returned $$STATUS, retrying..."
          sleep 10
        done

        echo "Health check failed after 5 attempts"
        exit 1
    waitFor: ['deploy-dev']

images:
  - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/${_SERVICE_NAME}:latest'

timeout: '1800s'
